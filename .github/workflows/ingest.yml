name: Ingest aircraft and vessel data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      VITE_AISSTREAM_KEY: ${{ secrets.VITE_AISSTREAM_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      - run: python backend/ingestor.py
